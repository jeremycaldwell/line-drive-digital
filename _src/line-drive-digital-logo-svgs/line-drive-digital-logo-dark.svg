<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.3 -75.2 821.5 99.4" width="492.9" height="59.64" role="img" aria-labelledby="ldd-title" style="overflow:hidden" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ldd-title">Line Drive Digital</title>
  <style>
    /* The full stop stays put. A copy is hit up and to the right with a fading streak and flies out of frame.
       Plays once: 0.6s delay, 1.4s flight. Edit the timing on .ldd-hit and .ldd-streak; the distance in the keyframe. */
    .ldd-hit { animation: ldd-hit 1.4s cubic-bezier(.25,.6,.45,1) 0.6s 1 both; }
    .ldd-streak { animation: ldd-streak 1.4s linear 0.6s 1 both; }
    @keyframes ldd-hit {
      0%   { transform: translate(0px, 0px); opacity: 1; }
      70%  { opacity: 1; }
      100% { transform: translate(150px, -107px); opacity: 0; }
    }
    @keyframes ldd-streak { 0% { opacity: 0; } 15%, 70% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ldd-hit, .ldd-streak { animation: none; opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="ldd-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d66733" stop-opacity="0"/>
      <stop offset="1" stop-color="#d66733" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
