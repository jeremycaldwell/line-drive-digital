<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.1 -131.2 453.8 240.4" width="907.6" height="480.8" role="img" aria-labelledby="ldd-title">
  <title id="ldd-title">Line Drive Digital</title>
  <style>
    /* 65b: the full stop always stays put; a copy of it is hit up and to the right with a short streak,
       fading out. Plays once: 0.6s pause, then a 2.1s flight. Change the delay or duration on .ball-copy. */
    .ball-copy { animation: ldd-launch 2.1s linear 0.6s 1 both; }
    .streak { animation: ldd-streak 2.1s linear 0.6s 1 both; }
    @keyframes ldd-launch {
      from { transform: translate(0px, 0px); opacity: 1; }
      to   { transform: translate(70px, -50px); opacity: 0; }
    }
    @keyframes ldd-streak { 0% { opacity: 0; } 20%, 75% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ball-copy, .streak { animation: none; opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="ldd-streak-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d66733" stop-opacity="0"/>
      <stop offset="1" stop-color="#d66733" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
